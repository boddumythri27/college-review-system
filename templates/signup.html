<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - College Review System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
        .navbar { background: #1a1a2e; padding: 14px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #e94560; font-size: 22px; font-weight: 700; text-decoration: none; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 24px; font-size: 15px; }
        .nav-links a:hover { color: #e94560; }
        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        .form-container { background: white; max-width: 480px; margin: 40px auto; padding: 36px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-container h1 { margin-bottom: 24px; color: #1a1a2e; font-size: 26px; }
        .form-container input { width: 100%; padding: 12px 14px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .form-container input:focus { outline: none; border-color: #e94560; }
        .btn { width: 100%; background: #e94560; color: white; padding: 13px; border-radius: 6px; border: none; cursor: pointer; font-size: 16px; font-weight: 500; }
        .btn:hover { background: #c73652; }
        .form-container p { text-align: center; margin-top: 16px; color: #666; }
        .form-container a { color: #e94560; text-decoration: none; }
        .alert { padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger { background: #f8d7da; color: #721c24; }
        .alert-warning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo">🎓 CollegeReview</a>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/search">Search</a>
        <a href="/login">Login</a>
        <a href="/signup">Signup</a>
    </div>
</nav>

<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="form-container">
        <h1>Create Account</h1>
        <form method="POST">
            <input type="text"     name="username" placeholder="Username" required>
            <input type="email"    name="email"    placeholder="Email"    required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <p>Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>

</body>
</html>
